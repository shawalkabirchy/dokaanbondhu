# DokaanBondhu CI (spec 18.3). integration, python and mobile are placeholders until their steps:
# integration and python in step 2, mobile when the app is created in step 2.
name: CI

on: [push, pull_request]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test

  host-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No host name in the source under packages/ or apps/
        run: >
          ! grep -rniE 'geargrid' packages apps --include='*.ts' --include='*.tsx' --include='*.json'
          --exclude='*.test.ts' --exclude='*.test.tsx' --exclude-dir=test --exclude-dir=node_modules
          --exclude-dir=.next --exclude-dir=android

  integration:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Integration tests start in step 2 (spec 18.3)."

  python:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Speech worker tests start in step 2 (spec 18.3)."

  mobile:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Mobile app checks start in step 2 (spec 18.3)."
