# DokaanBondhu CI (spec 18.3).
name: CI

on: [push, pull_request]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test

  host-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No host name in the source under packages/ or apps/
        run: >
          ! grep -rniE 'geargrid' packages apps --include='*.ts' --include='*.tsx' --include='*.json'
          --exclude='*.test.ts' --exclude='*.test.tsx' --exclude-dir=test --exclude-dir=node_modules
          --exclude-dir=.next --exclude-dir=android

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql: # test shop B, a second host shaped unlike GearGrid (D122)
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: shopb
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci" --health-interval 5s --health-timeout 5s --health-retries 20
    env: # throwaway values, local to the job's container
      PLATFORM_MIGRATION_DATABASE_URL: postgres://postgres:ci@localhost:5432/platform
      PLATFORM_DATABASE_URL: postgres://platform_api:ci-platform-api@localhost:5432/platform
      PLATFORM_ADMIN_DATABASE_URL: postgres://platform_admin:ci-platform-admin@localhost:5432/platform
      PLATFORM_API_PASSWORD: ci-platform-api
      PLATFORM_ADMIN_PASSWORD: ci-platform-admin
      GEARGRID_ENV: ci
      MIGRATION_DATABASE_URL: postgres://postgres:ci@localhost:5432/geargrid # GearGrid's own scripts
      APP_API_PASSWORD: ci-app-api
      DOKAAN_RO_PASSWORD: ci-dokaan-ro
      SHOPB_DATABASE_URL: mysql://root:ci@127.0.0.1:3306/shopb
      SHOPB_RO_PASSWORD: ci-shopb-ro
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5 # GearGrid is public, so no key is needed (D66)
        with:
          repository: shawalkabirchy/geargrid
          ref: main
          path: geargrid
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            geargrid/package-lock.json
      - name: Create the platform and geargrid databases in the one container
        run: |
          psql postgres://postgres:ci@localhost:5432/postgres -v ON_ERROR_STOP=1 -c "create database platform" -c "create database geargrid"
          echo "SEED_API_KEY=ggk_$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: GearGrid, the test host (bootstrap, migrate, roles, seed)
        working-directory: geargrid
        run: |
          npm ci
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/bootstrap.sql
          npm run db:migrate && npm run db:roles && npm run db:seed
      - name: Platform database (bootstrap, migrate, roles)
        run: |
          npm ci
          psql "$PLATFORM_MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/platform-db/bootstrap.sql
          npm run db:migrate && npm run db:roles
      - name: Test shop B (schema, seed, read-only user)
        run: |
          mysql -h 127.0.0.1 -uroot -pci shopb < tools/fixtures/shop-b/schema.sql
          mysql -h 127.0.0.1 -uroot -pci --default-character-set=utf8mb4 shopb < tools/fixtures/shop-b/seed.sql
          mysql -h 127.0.0.1 -uroot -pci -e "CREATE USER 'shopb_ro'@'%' IDENTIFIED BY '$SHOPB_RO_PASSWORD'; GRANT SELECT ON shopb.* TO 'shopb_ro'@'%';"
      - run: npm run test:integration

  python: # the speech worker's tests with fake models (spec 14.1): no GPU, no model download
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/speech
    steps:
      - uses: actions/checkout@v5
      - name: ffmpeg (the MP3 test)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv --python 3.11 && uv pip install -r requirements-test.txt
      - run: SPEECH_LOAD_MODELS=0 .venv/bin/python -m pytest -q

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Against the module list of the pinned Expo, not the newest release: a later Expo patch keeps CI green (D106).
      - name: Expo SDK 57 versions (typescript is pinned on purpose, spec 3.4)
        working-directory: apps/mobile
        env:
          EXPO_OFFLINE: "1"
        run: npx expo install --check
      - name: App tests (Jest)
        working-directory: apps/mobile
        run: npx jest
